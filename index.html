html <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Daily Mini Income - Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); animation: fadeIn 1s ease-in; text-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        input { display: block; width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Daily Mini Income</h2>
        <p>আপনার অ্যাকাউন্ট দিয়ে লগইন করুন</p>
        <input type="text" placeholder="ইউজার আইডি">
        <input type="password" placeholder="পাসওয়ার্ড">
        <button onclick="alert('লগইন সফল হয়েছে!')">লগইন করুন</button>
    </div>
</body>
</html>
