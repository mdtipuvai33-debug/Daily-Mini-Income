<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Mini Income Pro</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h1>সবগুলো ফিচার</h1>
        <div id="feature-grid" class="grid"></div>
    </div>

    <script>
        // এখানে ৯১টি ফিচারের নাম সাজানো আছে
        const features = [
            "ভিডিও মিশন ১", "ক্যাপচা ১", "লাকি স্পিন ১", "সার্ভে ১", "কুইজ ১", 
            "রেফারাল", "বোনাস", "ডেইলি চেকইন", "টাস্ক ১", "অফার ১",
            // এভাবে আপনি ৯১ পর্যন্ত নাম যোগ করতে পারবেন
        ];

        const grid = document.getElementById('feature-grid');

        features.forEach((name, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = name;
            btn.onclick = () => alert(name + " চালু হচ্ছে...");
            grid.appendChild(btn);
        });
    </script>
</body>
</html>
